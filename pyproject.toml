[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-field-lms"
version = "1.0.0"
description = "Lightweight Learning Management System engine for technical trades. Encapsulates 12 modular curriculum chapters, automated mastery assessments, practical lab checklists, and competency tracking from apprentice to master technician."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "edtech & technical curriculum", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-field-lms = "src.cli:main"
